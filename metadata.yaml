name: astrbot_plugin_preserve_atbot
display_name: 对话拾遗
short_desc: 按对话顺序保留插件发言，补全 @Bot 与引用上下文。
desc: 让插件发言、@Bot 和引用消息回到对话里。插件发言保留原文及来源，按发生顺序嵌入正常对话；开启群聊上下文感知时，与群聊补充消息共用其数量上限。每个 Bot、聊天和会话分支独立记录。
help: 启用「对话拾遗」后自动工作。可设置每个会话保留的插件发言条数、@Bot 显示名称和引用补全选项。支持 OneBot 与 QQ 官方 Bot，引用发送人补全适用于 OneBot。详见 README。
version: 1.3.1
author: TenmaGabriel0721
repo: https://github.com/TenmaGabriel0721/astrbot_plugin_preserve_atbot
support_platforms:
  - qq_official
  - qq_official_webhook
  - aiocqhttp
